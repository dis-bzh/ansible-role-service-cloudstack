stages:
  - lint
  - test

lint:
  stage: lint
  image: python:3.12-slim
  before_script:
    - pip install ansible-core ansible-lint ansible.utils
  script:
    - ansible-lint --profile min .
    - ansible-playbook --syntax-check -i tests/inventory/syntax-check.yml tests/site-syntax-check.yml

test:
  stage: test
  image: docker:24
  services:
    - docker:24-dind
  script:
    - apk add --no-cache bash curl jq python3 py3-pip
    - pip install --break-system-packages ansible-core netaddr
    - ansible-galaxy collection install ansible.utils
    - ./tests/run-simulator-test.sh
